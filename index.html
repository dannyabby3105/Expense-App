<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<header>
  <h1>Expense Tracker</h1>
  <div class="bar-top">
    <select id="month" aria-label="Month"></select>
    <select id="currency" aria-label="Currency">
      <option value="₦">₦ NGN</option><option value="$">$ USD</option><option value="€">€ EUR</option><option value="£">£ GBP</option>
    </select>
    <span class="who" id="who" hidden></span>
    <button class="btn ghost small" id="authBtn">Sign in</button>
  </div>
</header>
<p class="hint" id="rateNote" style="margin:8px 0 0"></p>
<p class="hint" id="status" aria-live="polite" style="margin:4px 0 0"></p>

<section class="hero" aria-live="polite">
  <div class="label" id="monthLabel">Spent this month</div>
  <div class="big" id="total">0</div>
  <div class="split" id="split" aria-hidden="true"></div>
  <div class="legend" id="legend"></div>
  <div class="budget" id="budget">
    <span class="msg" id="budgetMsg"></span>
    <label style="display:inline;margin:0">Monthly budget<input id="budgetInput" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label>
    <div class="track"><div class="fill" id="fill" style="width:0"></div></div>
  </div>
</section>

<section class="panel trend"><h2>Last 6 months</h2><div class="months" id="trend"></div></section>

<div class="grid">
  <section class="panel">
    <h2 id="formTitle">Add expense</h2>
    <p class="err" id="err" role="alert"></p>
    <label>Description<input id="desc" maxlength="60" placeholder="e.g. Lunch at campus"></label>
    <div class="row">
      <label>Amount<input id="amount" type="number" min="0" step="any" inputmode="decimal" placeholder="0.00"></label>
      <label>Date<input id="date" type="date"></label>
    </div>
    <div class="row"><label>Category<select id="cat"></select></label><label>Currency<select id="fcur"></select></label></div>
    <button class="btn" id="add">Add expense</button>
    <button class="btn ghost" id="cancel" hidden style="margin-top:8px">Cancel edit</button>
  </section>

  <section class="panel">
    <div class="list-head">
      <h2>Expenses</h2>
      <span class="bar-top"><select id="filter" aria-label="Filter by category"></select><button class="btn ghost small" id="export">Export CSV</button></span>
    </div>
    <ul id="list"></ul>
  </section>
</div>
</main>

<dialog id="authDlg">
  <h2>Account</h2>
  <p class="hint">Sign in to sync your expenses across devices. This needs the optional server (run <code>npm start</code>). If your account already has data, it replaces what is on this device.</p>
  <p class="err" id="aErr" role="alert"></p>
  <label>Email<input id="aEmail" type="email" autocomplete="email"></label>
  <label>Password (8+ characters)<input id="aPass" type="password" autocomplete="current-password"></label>
  <div class="row"><button class="btn" id="aLogin">Log in</button><button class="btn ghost" id="aSignup">Sign up</button></div>
  <button class="btn ghost" id="aClose" style="margin-top:8px">Close</button>
</dialog>
<script src="js/app.js"></script>
</body>
</html>
